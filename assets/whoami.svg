<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="title desc">
  <title id="title">Mateo Mercado — Backend Developer</title>
  <desc id="desc">A terminal styled profile card with Mateo Mercado's context, mission, projects and the layered backend architecture he builds with.</desc>
  <defs>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#3ddbc1"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .flow { stroke-dasharray: 4 5; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -18; } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="960" height="390" rx="18" fill="#0b1322"/>
  <rect x="9" y="9" width="942" height="372" rx="13" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <circle cx="35" cy="35" r="5" fill="#ff5f57"/>
  <circle cx="54" cy="35" r="5" fill="#febc2e"/>
  <circle cx="73" cy="35" r="5" fill="#28c840"/>
  <text x="98" y="41" fill="#7d8fa9" font-size="15">MateoMg06  ·  profile shell  ·  online</text>
  <path d="M29 58H931" stroke="#1f3048"/>

  <rect x="29" y="78" width="594" height="271" rx="9" fill="#0e1a2e" stroke="#2c4467" stroke-width="1.5"/>
  <text x="48" y="111" fill="#3ddbc1" font-size="20" font-weight="700">❯ whoami</text>
  <text x="48" y="143" fill="#e3ecf5" font-size="18">mateo_mercado</text>
  <text x="206" y="143" fill="#7d8fa9" font-size="18">—</text>
  <text x="231" y="143" fill="#f5c26b" font-size="18">Backend Developer</text>

  <path d="M48 166H604" stroke="#1f3048"/>
  <text x="48" y="196" fill="#7d8fa9" font-size="17">context:</text>
  <text x="166" y="196" fill="#7aa2f7" font-size="17">estudiante de desarrollo de software</text>
  <text x="48" y="225" fill="#7d8fa9" font-size="17">mission:</text>
  <text x="166" y="225" fill="#3ddbc1" font-size="17">APIs limpias, seguras y escalables</text>

  <text x="48" y="267" fill="#3ddbc1" font-size="20" font-weight="700">❯ ls projects/</text>
  <text x="48" y="299" fill="#f5c26b" font-size="16">riwi-tv/</text>
  <text x="214" y="299" fill="#c3cfdd" font-size="16">API de cines · Express · PostgreSQL</text>
  <text x="48" y="326" fill="#f5c26b" font-size="16">smile-and-wave/</text>
  <text x="214" y="326" fill="#c3cfdd" font-size="16">marketplace full-stack · React</text>
  <rect class="cursor" x="514" y="312" width="10" height="18" fill="#3ddbc1"/>

  <rect x="651" y="78" width="280" height="271" rx="9" fill="#0e1a2e" stroke="#2c4467" stroke-width="1.5"/>
  <text x="674" y="111" fill="#f5c26b" font-size="17">request lifecycle</text>

  <g font-size="13" text-anchor="middle">
    <rect x="696" y="126" width="190" height="26" rx="6" fill="#132440" stroke="#7aa2f7"/>
    <text x="791" y="144" fill="#e3ecf5">routes</text>
    <rect x="696" y="161" width="190" height="26" rx="6" fill="#132440" stroke="#7aa2f7"/>
    <text x="791" y="179" fill="#e3ecf5">middlewares · jwt</text>
    <rect x="696" y="196" width="190" height="26" rx="6" fill="#132440" stroke="#7aa2f7"/>
    <text x="791" y="214" fill="#e3ecf5">controllers</text>
    <rect x="696" y="231" width="190" height="26" rx="6" fill="#132440" stroke="#7aa2f7"/>
    <text x="791" y="249" fill="#e3ecf5">services</text>
    <rect x="696" y="266" width="190" height="26" rx="6" fill="#132440" stroke="#7aa2f7"/>
    <text x="791" y="284" fill="#e3ecf5">repositories</text>
    <rect x="696" y="301" width="190" height="26" rx="6" fill="#0f3a3a" stroke="#3ddbc1" filter="url(#glow)"/>
    <text x="791" y="319" fill="#3ddbc1" font-weight="700">postgresql</text>
  </g>
  <path class="flow" d="M681 139V314" stroke="#3ddbc1" stroke-width="2" fill="none"/>
  <path d="M677 308l4 7 4-7" stroke="#3ddbc1" stroke-width="2" fill="none"/>
</svg>
